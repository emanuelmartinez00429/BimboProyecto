name: contexto

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contexto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar contexto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Historial completo: el verificador compara fechas de commits contra 'updated'
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Validar integridad del contexto
        run: node scripts/contexto/verificar.js
      - name: Pruebas unitarias de scripts
        run: node --test scripts/contexto/
