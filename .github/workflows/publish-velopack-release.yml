name: Publicar actualización Velopack

on:
  # Publicación: solo cambios que alteran el binario distribuido (o el script que lo
  # empaqueta) o un disparo manual explícito. La documentación (contexto/), la
  # configuración de agentes (.claude/, .agents/, .codex/, .cursor/) y el propio YAML
  # de CI no publican release: no cambian el ejecutable y generarían una versión
  # descendable de ~74 MB por cada commit. Esos cambios los valida ci.yml.
  push:
    branches:
      - main
    paths:
      - "BimboProyecto.sln"
      - "CapaUI/**"
      - "CapaDatos/**"
      - "CapaDominio/**"
      - "CapaAplicacion4/**"
      - "scripts/publish-release.ps1"
  # Acción explícita de release. Requiere que este archivo exista también en la rama
  # por defecto del repositorio (master) para aparecer en la UI de Actions.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: velopack-release-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.161

      - name: Publicar Release de Velopack
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\scripts\publish-release.ps1 -Upload -Version "1.0.$env:GITHUB_RUN_NUMBER"
